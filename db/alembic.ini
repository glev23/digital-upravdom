[alembic]
script_location = %(here)s/migrations
prepend_sys_path = ../src
path_separator = os

# Таймзона для имён файлов ревизий.
timezone = UTC

# URL берётся из окружения в migrations/env.py (settings.database_url),
# а не отсюда — чтобы не дублировать источник правды и не рисковать
# рассинхроном с .env.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
